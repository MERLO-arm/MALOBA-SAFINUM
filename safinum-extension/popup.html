<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Maloba Finance (eto)</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body
    class="w-85 m-0 bg-slate-900 text-slate-50 font-sans p-3.5 select-none antialiased"
  >
    <div
      class="flex items-center gap-2.5 pb-3 border-b border-maloba-orange/25 mb-3"
    >
      <img
        src="icons/logo_maloba.png"
        alt="Maloba Logo"
        class="w-9 h-9 rounded-[10px] object-contain bg-maloba-orange/15 border border-maloba-orange/40 p-0.5"
      />
      <div>
        <div class="flex items-center gap-1.5">
          <span class="text-sm font-extrabold tracking-tight text-white"
            >Maloba Finance</span
          >
          <span
            class="text-[9px] px-1.5 py-0.5 rounded border border-maloba-orange/40 bg-maloba-orange/15 text-maloba-orange font-bold"
            >Ekwali</span
          >
        </div>
        <div class="text-[11px] text-maloba-amber" id="popup-subtitle">
          Éton (eto) · Dataset réel Maloba/Ekwali
        </div>
      </div>
    </div>

    <div
      class="grid grid-cols-[1.4fr_1fr_1fr] gap-1.5 bg-slate-800 p-1 rounded-[10px] mb-3 border border-slate-700 relative"
    >
      <div id="popup-lang-picker" class="relative">
        <button
          type="button"
          id="popup-lang-trigger"
          aria-haspopup="listbox"
          aria-expanded="false"
          class="w-full flex items-center justify-between gap-1.5 bg-linear-to-br from-maloba-orange to-maloba-terracotta text-white border border-white/25 py-1 pl-1.5 pr-2 rounded-[7px] text-[11px] font-bold cursor-pointer outline-none shadow-[0_2px_6px_rgba(255,121,0,0.35)]"
          title="Choisir la langue d'accessibilité"
        >
          <span
            id="popup-lang-trigger-content"
            class="flex items-center gap-1.5 min-w-0 truncate"
          ></span>
          <span class="text-[9px] opacity-85 shrink-0">▾</span>
        </button>
        <div
          id="popup-lang-menu"
          role="listbox"
          class="hidden absolute left-0 top-[calc(100%+6px)] w-68 max-h-64 overflow-y-auto bg-slate-900 border border-maloba-orange/45 rounded-[10px] p-1.5 shadow-2xl z-50 space-y-1"
        ></div>
      </div>
      <button
        class="mode-btn border-0 bg-transparent text-slate-400 py-1.5 px-1 rounded-[7px] text-[11px] font-semibold cursor-pointer transition-all duration-150 hover:text-white [&.active]:bg-maloba-orange [&.active]:text-white [&.active]:font-bold [&.active]:shadow-[0_2px_6px_rgba(255,121,0,0.35)]"
        data-mode="bilingual"
      >
        Bilingue
      </button>
      <button
        class="mode-btn border-0 bg-transparent text-slate-400 py-1.5 px-1 rounded-[7px] text-[11px] font-semibold cursor-pointer transition-all duration-150 hover:text-white [&.active]:bg-maloba-orange [&.active]:text-white [&.active]:font-bold [&.active]:shadow-[0_2px_6px_rgba(255,121,0,0.35)]"
        data-mode="original"
      >
        Original
      </button>
    </div>

    <div class="grid grid-cols-2 gap-1.5 mb-2.5">
      <button
        class="speak-btn w-full border-0 bg-linear-to-br from-emerald-400 to-emerald-600 text-slate-950 font-extrabold text-[11.5px] p-2 rounded-[10px] cursor-pointer shadow-[0_4px_12px_rgba(16,185,129,0.3)] transition duration-150 hover:brightness-105"
        id="btn-read-page"
      >
        🔊 Lire toute la page
      </button>
      <button
        class="speak-btn w-full border-0 bg-linear-to-br from-maloba-orange to-maloba-terracotta text-white font-bold text-[11.5px] p-2 rounded-[10px] cursor-pointer shadow-[0_4px_12px_rgba(255,121,0,0.3)] transition duration-150 hover:brightness-105"
        id="btn-speak-step"
      >
        🔊 Lire l'étape
      </button>
    </div>

    <div class="flex gap-1.5 items-center bg-slate-800 border border-slate-700 rounded-[10px] p-1.5 mb-3">
      <input
        type="text"
        id="popup-num-input"
        class="flex-1 min-w-0 bg-slate-900 text-white border border-slate-700 rounded-md px-2 py-1 text-[11.5px] font-semibold outline-none focus:border-maloba-orange"
        placeholder="Montant (ex: 250 000 FCFA)"
        aria-label="Montant à lire"
      />
      <button
        type="button"
        id="popup-btn-speak-num"
        class="border-0 bg-linear-to-br from-maloba-orange to-maloba-terracotta text-white font-bold text-[11px] px-2.5 py-1.5 rounded-md cursor-pointer shrink-0 hover:brightness-105"
      >
        🔢 Lire
      </button>
    </div>

    <div
      class="bg-slate-800 border border-maloba-orange/30 rounded-[10px] py-2.5 px-3 text-[11.5px] leading-relaxed text-slate-300 space-y-1"
    >
      <div class="flex justify-between items-center">
        <span>Langue active :</span>
        <span class="text-maloba-orange font-bold" id="stat-lang-active"
          >Éton (eto)</span
        >
      </div>
      <div class="flex justify-between items-center">
        <span>Dataset réel :</span>
        <span class="text-maloba-orange font-bold" id="stat-dataset-info"
          >192 entrées · 191 audios</span
        >
      </div>
      <div class="flex justify-between items-center">
        <span>Nœuds DOM traduits :</span>
        <span class="text-maloba-orange font-bold" id="stat-nodes">--</span>
      </div>
      <div class="flex justify-between items-center">
        <span>Intégrité des montants :</span>
        <span class="text-emerald-500 font-bold">100 % Intègre (0 écart)</span>
      </div>
    </div>

    <script src="knowledge_base.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
