<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Maloba AnyDoc (fub)</title>
  <style>
    body {
      margin: 0;
      width: 340px;
      background: #0f172a;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 121, 0, 0.25);
      margin-bottom: 12px;
    }
    .logo-img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(255, 121, 0, 0.15);
      border: 1px solid rgba(255, 121, 0, 0.4);
      padding: 2px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .badge-ekwali {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 121, 0, 0.4);
      background: rgba(255, 121, 0, 0.15);
      color: #ff7900;
      font-weight: 700;
    }
    .subtitle {
      font-size: 11px;
      color: #ffa040;
    }
    .mode-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #1e293b;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      padding: 7px 4px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      background: #ff7900;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(255, 121, 0, 0.35);
    }
    .speak-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #ff7900 0%, #e05515 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 12.5px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(255, 121, 0, 0.3);
      transition: filter 0.15s ease, transform 0.1s ease;
    }
    .speak-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 121, 0, 0.3);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11.5px;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .stat-val {
      color: #ff7900;
      font-weight: 700;
    }
    .stat-val-green {
      color: #10b981;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/logo_maloba.png" alt="Maloba Logo" class="logo-img" />
    <div>
      <div class="title-row">
        <span class="title">Maloba AnyDoc</span>
        <span class="badge-ekwali">Ekwali</span>
      </div>
      <div class="subtitle">Fulfuldé du Cameroun (Adamaoua) · 18 Sources</div>
    </div>
  </div>

  <div class="mode-group">
    <button class="mode-btn active" data-mode="fub">Fulfuldé (fub)</button>
    <button class="mode-btn" data-mode="bilingual">Bilingue</button>
    <button class="mode-btn" data-mode="original">Original</button>
  </div>

  <button class="speak-btn" id="btn-speak-step">
    🔊 Lire &amp; Expliquer l'étape active
  </button>

  <div class="card">
    <div class="stat-row">
      <span>Langue nationale cible :</span>
      <span class="stat-val">Fulfuldé (fub)</span>
    </div>
    <div class="stat-row">
      <span>Corpus unifié moissonné :</span>
      <span class="stat-val">99 633 paires (18 sources)</span>
    </div>
    <div class="stat-row">
      <span>Nœuds DOM traduits :</span>
      <span class="stat-val" id="stat-nodes">--</span>
    </div>
    <div class="stat-row">
      <span>Intégrité des montants :</span>
      <span class="stat-val-green">100 % Intègre</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
