<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Maloba AnyDoc (fub)</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="w-85 m-0 bg-slate-900 text-slate-50 font-sans p-3.5 select-none antialiased">
  <div class="flex items-center gap-2.5 pb-3 border-b border-maloba-orange/25 mb-3">
    <img src="icons/logo_maloba.png" alt="Maloba Logo" class="w-9 h-9 rounded-[10px] object-contain bg-maloba-orange/15 border border-maloba-orange/40 p-0.5" />
    <div>
      <div class="flex items-center gap-1.5">
        <span class="text-sm font-extrabold tracking-tight text-white">Maloba AnyDoc</span>
        <span class="text-[9px] px-1.5 py-0.5 rounded border border-maloba-orange/40 bg-maloba-orange/15 text-maloba-orange font-bold">Ekwali</span>
      </div>
      <div class="text-[11px] text-maloba-amber" id="popup-subtitle">Fulfuldé (fub) &amp; Ewondo (ewo) · 18 Sources</div>
    </div>
  </div>

  <div class="grid grid-cols-[1.25fr_1fr_1fr] gap-1.5 bg-slate-800 p-1 rounded-[10px] mb-3 border border-slate-700">
    <select id="popup-lang-select" class="lang-dropdown bg-linear-to-br from-maloba-orange to-maloba-terracotta text-white border border-white/25 py-1.5 pl-1.5 pr-3.5 rounded-[7px] text-[11px] font-bold cursor-pointer outline-none shadow-[0_2px_6px_rgba(255,121,0,0.35)] appearance-none text-ellipsis whitespace-nowrap" title="Choisir la langue d'accessibilité">
      <option value="fub" selected>🇨🇲 Fulfuldé (fub) · Grand-Nord</option>
      <option value="ewo">🇨🇲 Ewondo (ewo) · Centre / Sud</option>
      <option value="dua" disabled class="opacity-60">🇨🇲 Douala (dua) [À venir]</option>
      <option value="bbj" disabled class="opacity-60">🇨🇲 Ghomálá' (bbj) [À venir]</option>
      <option value="bas" disabled class="opacity-60">🇨🇲 Bassa (bas) [À venir]</option>
    </select>
    <button class="mode-btn border-0 bg-transparent text-slate-400 py-1.5 px-1 rounded-[7px] text-[11px] font-semibold cursor-pointer transition-all duration-150 hover:text-white [&.active]:bg-maloba-orange [&.active]:text-white [&.active]:font-bold [&.active]:shadow-[0_2px_6px_rgba(255,121,0,0.35)]" data-mode="bilingual">Bilingue</button>
    <button class="mode-btn border-0 bg-transparent text-slate-400 py-1.5 px-1 rounded-[7px] text-[11px] font-semibold cursor-pointer transition-all duration-150 hover:text-white [&.active]:bg-maloba-orange [&.active]:text-white [&.active]:font-bold [&.active]:shadow-[0_2px_6px_rgba(255,121,0,0.35)]" data-mode="original">Original</button>
  </div>

  <button class="speak-btn w-full border-0 bg-linear-to-br from-maloba-orange to-maloba-terracotta text-white font-bold text-[12.5px] p-2.5 rounded-[10px] cursor-pointer mb-3 shadow-[0_4px_12px_rgba(255,121,0,0.3)] transition duration-150 hover:brightness-105 hover:-translate-y-0.5 active:translate-y-0" id="btn-speak-step">
    🔊 Lire &amp; Expliquer l'étape active
  </button>

  <div class="bg-slate-800 border border-maloba-orange/30 rounded-[10px] py-2.5 px-3 text-[11.5px] leading-relaxed text-slate-300 space-y-1">
    <div class="flex justify-between items-center">
      <span>Langues actives :</span>
      <span class="text-maloba-orange font-bold" id="stat-lang-active">Fulfuldé &amp; Ewondo</span>
    </div>
    <div class="flex justify-between items-center">
      <span>Corpus unifié :</span>
      <span class="text-maloba-orange font-bold">18 sources (99 633 paires)</span>
    </div>
    <div class="flex justify-between items-center">
      <span>Nœuds DOM traduits :</span>
      <span class="text-maloba-orange font-bold" id="stat-nodes">--</span>
    </div>
    <div class="flex justify-between items-center">
      <span>Intégrité des montants :</span>
      <span class="text-emerald-500 font-bold">100 % Intègre (0 écart)</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
